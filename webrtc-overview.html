<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>五分钟全貌 · 一场多人视频会议</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
<meta name="theme-color" content="#4A7856">
<style>
/* tokens — 数字花园 · 与全站同一套（见 AGENTS.md） */
:root{
  --paper:#F9FAF4; --paper-2:#FEFEFB; --paper-3:#F0F2E4; --paper-4:#DDE4D2;
  --ink:#333D2E; --ink-2:#66705A; --ink-3:#8B957D;
  --rule:#D5DCC6; --rule-2:#E6EBDA;
  --a:#C97B4A; --a-ink:#A05C2C; --a-soft:#F5E6D8;
  --b:#4A7856; --b-ink:#3D6B4C; --b-soft:#E7EFE3;
  --wire:#4E8378; --wire-ink:#3F6B60; --wire-soft:#E4EEE9;
  --ok:#287158; --ok-soft:#DCEBE3; --err:#B34238; --err-soft:#F2D8D4; --warn:#9C7C25; --warn-soft:#F1EAC9;
  --sh-s:0 2px 10px rgba(74,120,86,.12);
  --sh-m:0 6px 18px rgba(74,120,86,.14);
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Helvetica Neue",sans-serif;
  --serif:"Songti SC","STSong","Noto Serif SC",Georgia,serif;
  --mono:ui-monospace,"SF Mono",Menlo,"JetBrains Mono",Consolas,monospace;
  --pad:clamp(16px,5vw,56px);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
body.embedded{background:transparent}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2.5px solid var(--wire);outline-offset:3px;border-radius:4px}
.wrap{width:min(1080px,100% - var(--pad)*2);margin-inline:auto}
body.embedded .wrap{width:100%}
.m{font-family:var(--mono);font-size:.85em;background:var(--paper-3);padding:1px 6px;border-radius:5px}

.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0 0}
.top a{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;color:var(--ink-2);text-decoration:none;border-bottom:1.5px solid var(--rule)}
.top .no{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;color:var(--ink-3)}
.head{padding:28px 0 18px}
.head h1{font-family:var(--serif);font-weight:700;font-size:clamp(1.8rem,4.6vw,2.8rem);line-height:1.2;margin:0 0 10px}
.head h1 .k{display:block;font-family:var(--mono);font-weight:400;font-size:.7rem;letter-spacing:.2em;color:var(--ink-3);margin-bottom:10px}
.head p{margin:0;color:var(--ink-2);max-width:62ch}
body.embedded .top,body.embedded .head,body.embedded footer{display:none}

/* ── 播放器 ── */
.player{background:var(--paper-2);border:1.5px solid var(--rule);border-radius:12px;box-shadow:var(--sh-m);overflow:hidden}
.stage{position:relative;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);min-height:400px}
.map{position:relative;background:radial-gradient(ellipse at 55% 55%,var(--b-soft),transparent 70%),var(--paper-2);border-right:1.5px dashed var(--rule)}
.map svg{display:block;width:100%;height:auto;aspect-ratio:600/480}
.card{padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-width:0;transition:opacity .35s}
.card.fade{opacity:0}
.card .ck{font:700 .66rem/1.4 var(--mono);letter-spacing:.12em;color:var(--wire-ink)}
.card h3{margin:0;font:700 1.12rem/1.4 var(--serif)}
.card p{margin:0;font-size:.86rem;color:var(--ink-2)}
.card .box{border:1.5px solid var(--rule);border-radius:9px;background:var(--paper);padding:10px 12px;font-size:.8rem}
.card .code{font:500 .74rem/1.75 var(--mono);color:var(--ink);white-space:pre-wrap;word-break:break-all}
.card .code .c{color:var(--ink-3)}
.card .code .h{background:var(--a-soft);border-radius:3px;padding:0 3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 .72rem/1.3 var(--mono);padding:5px 9px;border-radius:7px;background:var(--paper-3);border:1.5px solid var(--rule)}
.chip.a{background:var(--a-soft);border-color:#E6C3A6;color:var(--a-ink)}
.chip.b{background:var(--b-soft);border-color:#BFD3BF;color:var(--b-ink)}
.chip.w{background:var(--wire-soft);border-color:#B9D2C9;color:var(--wire-ink)}
.chip.ok{background:var(--ok-soft);border-color:#9CC9B3;color:var(--ok)}
.chip.err{background:var(--err-soft);border-color:#E3B5AE;color:var(--err)}
.chip.dim{opacity:.45}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:10px;align-items:center;font-size:.82rem;color:var(--ink-2)}
.row > .chip{flex:none;white-space:nowrap}
.row > span:last-child{flex:1;min-width:0}
.row b{color:var(--ink)}
.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font:600 .74rem/1.3 var(--mono)}
.flow .s{padding:6px 9px;border-radius:7px;background:var(--paper-3);border:1.5px solid var(--rule)}
.flow .ar{color:var(--ink-3)}
.bar{display:flex;gap:3px;height:30px}
.bar span{display:flex;align-items:center;justify-content:center;border-radius:4px;font:600 .64rem/1 var(--mono);color:var(--ink);overflow:hidden;white-space:nowrap}
.mini-svg{display:block;width:100%;height:auto}

.play-big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(249,250,244,.55);z-index:3}
.play-big button{display:flex;align-items:center;gap:12px;padding:14px 26px;white-space:nowrap;border-radius:99px;background:var(--wire);color:var(--paper-2);font:700 1rem/1 var(--sans);box-shadow:var(--sh-m)}
.play-big button:hover{background:var(--wire-ink)}
.play-big.off{display:none}

.subs{min-height:4.4em;padding:12px 20px;border-top:1.5px dashed var(--rule);background:var(--paper);font-size:1.02rem;line-height:1.65;color:var(--ink);display:flex;align-items:center}
.subs.hidden-cc{visibility:hidden}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 16px;border-top:1.5px solid var(--rule-2)}
.ib{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:34px;padding:0 10px;border-radius:99px;border:1.5px solid var(--rule);background:var(--paper-2);font:600 .76rem/1 var(--mono);color:var(--ink-2)}
.ib:hover{border-color:var(--wire);color:var(--ink)}
.ib.pri{background:var(--wire);border-color:var(--wire);color:var(--paper-2)}
.ib[aria-pressed="true"]{border-color:var(--wire);color:var(--wire-ink);background:var(--wire-soft)}
.time{font:600 .74rem/1 var(--mono);color:var(--ink-2);min-width:96px}
.prog{flex:1 1 220px;position:relative;height:24px;cursor:pointer;display:flex;align-items:center}
.prog .track{position:absolute;left:0;right:0;height:6px;border-radius:99px;background:var(--rule-2);overflow:hidden}
.prog .fill{position:absolute;left:0;top:0;bottom:0;background:var(--wire);border-radius:99px}
.prog .tick{position:absolute;top:4px;width:2px;height:16px;background:var(--paper-2);border-left:1.5px solid var(--ink-3);transform:translateX(-1px)}
.chs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;padding:10px 16px 14px;border-top:1.5px solid var(--rule-2)}
.chb{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 10px;border-radius:9px;border:1.5px solid var(--rule);background:var(--paper);text-align:left;min-width:0}
.chb .n{font:700 .64rem/1.3 var(--mono);color:var(--ink-3);letter-spacing:.06em}
.chb .t{font-size:.78rem;font-weight:700;line-height:1.35;color:var(--ink)}
.chb[aria-current="true"]{border-color:var(--wire);background:var(--wire-soft)}
.chb[aria-current="true"] .n{color:var(--wire-ink)}
.more{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:0 16px 14px;font-size:.84rem;color:var(--ink-2)}
.more a{font-family:var(--mono);font-size:.78rem;color:var(--wire-ink);text-decoration:none;border-bottom:1.5px solid var(--rule)}
.more a:hover{border-color:var(--wire)}
.transcript{margin-top:16px;background:var(--paper-2);border:1.5px solid var(--rule);border-radius:10px;padding:4px 18px}
.transcript summary{cursor:pointer;padding:10px 0;font-weight:700;font-size:.92rem}
.transcript h4{margin:12px 0 4px;font:700 .95rem/1.4 var(--serif)}
.transcript p{margin:0 0 6px;font-size:.88rem;color:var(--ink-2)}
footer{margin-top:28px;border-top:1.5px solid var(--rule)}
footer p{font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;color:var(--ink-3);padding:18px 0 34px;margin:0}

/* 地图元素 */
#map .el{transition:opacity .45s}
#map .el.off{opacity:0}
#map .el.dim{opacity:.32}
#map .ln{fill:none;stroke:#C9D3B6;stroke-width:3;stroke-dasharray:6 7;stroke-linecap:round;transition:stroke .4s,stroke-width .4s,opacity .45s}
#map .ln.live{stroke-dasharray:none;stroke:#B9CDBF;stroke-width:5}
#map .ln.ok{stroke-dasharray:none;stroke:#7FB59C;stroke-width:6}
#map .ln.sig{stroke:#8FB5A9;stroke-width:2.5;stroke-dasharray:6 6}
#map .hl > .halo{opacity:0;transition:opacity .4s}
#map .hl.hi > .halo{opacity:1}

@media (max-width:820px){
  .stage{grid-template-columns:1fr}
  .map{border-right:none;border-bottom:1.5px dashed var(--rule)}
  .chs{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:520px){
  .play-big button{padding:12px 20px;font-size:.92rem}
  .subs{font-size:.94rem;padding:10px 14px}
  .card{padding:14px}
  .ctl{padding:10px 12px}
  .chs{grid-template-columns:repeat(2,minmax(0,1fr));padding:10px 12px 12px}
}
@media (prefers-reduced-motion:reduce){
  .card,#map .el,#map .ln{transition:none}
}
</style>
</head>

</header>

{"t0": 33.84, "t1": 49.026, "scene": "header", "sub": "每个包都带着序号、时间戳和 SSRC：序号用来发现丢包，时间戳说明这一帧该什么时候播，SSRC 说明它属于哪一路流。这一帧的最后一个包，还会打上 Marker 标记。"}, {"t0": 49.406, "t1": 58.833, "scene": "srtp", "sub": "发出去之前，载荷用 SRTP 加密。注意加密是逐跳的：SFU 自己就是这条加密连接的另一端。"}]}, {"id": "ch4", "title": "SFU：只转发，不解码", "more": [["规模化拓扑", "webrtc-topology.html"]], "src": "overview/ch4.mp3", "dur": 44.307, "cues": [{"t0": 0.25, "t1": 7.413, "scene": "sfuin", "sub": "SFU 收到甲的几档流。它不解码画面，只做一件事：决定给谁转发哪一档。"}, {"t0": 7.793, "t1": 16.363, "scene": "fanout", "sub": "乙的网络很好，拿到高清；丙在弱网里，拿到低清；丁把甲的窗口缩成了小图，也只需要低清。"}, {"t0": 16.743, "t1": 23.047, "scene": "pause", "sub": "某一档如果没人要，可以通知甲把它停掉，省下编码的计算和上行带宽。"}, {"t0": 23.427, "t1": 33.83, "scene": "uplink", "sub": "不管房间里有几个人，甲都只上传自己这一份，分发的代价落在 SFU 的带宽上。这就是多人会议默认用 SFU 的原因。"}, {"t0": 34.21, "t1": 43.927, "scene": "rewrite", "sub": "转发时，SFU 还会改写序号和时间戳，让每个接收者看到的都是一条连续的流，哪怕中途换了清晰度。"}]}, {"id": "ch5", "title": "收下来：拼帧、解码、音画同步", "more": [["解封装演示", "webrtc-rtp.html#s5"], ["音画同步", "webrtc-rtp.html#s10"]], "src": "overview/ch5.mp3", "dur": 44.364, "cues": [{"t0": 0.25, "t1": 4.081, "scene": "arrive", "sub": "在乙这边，包陆续到达，顺序可能是乱的。"}, {"t0": 4.461, "t1": 14.399, "scene": "parse", "sub": "以 H.264 为例，libwebrtc 每收到一个包就先解析：去掉分片头，还原出原来的 NAL 头，再补上起始码。"}, {"t0": 14.779, "t1": 23.394, "scene": "assemble", "sub": "然后按序号排队。从带 Marker 的那个包往回找，序号连续、时间戳相同的包，拼起来就是完整的一帧。"}, {"t0": 23.774, "t1": 28.592, "scene": "decode", "sub": "拼好的帧交给解码器，还原成图像，画到乙的屏幕上。"}, {"t0": 28.972, "t1": 43.984, "scene": "avsync", "sub": "声音是另一路流，时钟和起点都不一样。接收端靠 RTCP 发送报告里记下的两个时间——墙上时钟和 RTP 时间戳——把两路换算到同一块表上，让嘴型对上声音。"}]}, {"id": "ch6", "title": "出了问题：RTCP 反馈", "more": [["RTCP 反馈", "webrtc-rtp.html#s11"], ["SR 与 RR", "webrtc-rtp.html#s9"]], "src": "overview/ch6.mp3", "dur": 65.723, "cues": [{"t0": 0.25, "t1": 6.264, "scene": "loss", "sub": "网络总会出问题。这时候，RTCP 就是双方之间的调度电话。"}, {"t0": 6.644, "t1": 17.047, "scene": "nack", "sub": "乙发现序号断了，就立刻发 NACK，请求重发那个包。libwebrtc 默认会协商 RTX，重传包走单独的 RTX 流。"}, {"t0": 17.427, "t1": 31.591, "scene": "pli", "sub": "如果迟迟拼不出能解码的帧，接收端就发 PLI：画面坏了，给我一个关键帧。libwebrtc 平时等三秒，正在等关键帧时只等两百毫秒。"}, {"t0": 31.971, "t1": 43.267, "scene": "tcc", "sub": "接收端还会不断回报每个包是什么时候到的，也就是 transport-cc。发送端据此估算带宽，网络变差就降低码率。"}, {"t0": 43.647, "t1": 50.381, "scene": "rr", "sub": "定期的接收报告里，还有丢包率、抖动，以及计算往返时延用的两个时间。"}, {"t0": 50.761, "t1": 65.343, "scene": "summary", "sub": "回顾一下：信令和 SDP 谈规则，ICE 找路，DTLS 建立加密，RTP 运货，SFU 分发，RTCP 打电话。点开每章下面的链接，去看每个模块的细节吧。"}]}];/*TIMELINE-END*/

/* ── 地图渲染 ── */
const svg = $('#map'), flowsG = $('#flows');
const ALL = Array.from(svg.querySelectorAll('.el')).map(e => e.id).filter(Boolean);
let flows = [];
function applyMap(m){
  const show = new Set(m.show || []), hi = new Set(m.hi || []), dim = new Set(m.dim || []), ok = new Set(m.ok || []);
  ALL.forEach(id => {
    const el = document.getElementById(id);
    el.classList.toggle('off', !show.has(id));
    el.classList.toggle('dim', dim.has(id));
    el.classList.toggle('hi', hi.has(id));
    if (el.classList.contains('ln') && !el.classList.contains('sig')) {
      el.classList.toggle('ok', ok.has(id));
      el.classList.toggle('live', !ok.has(id) && !!(m.flows || []).some(f => f.p === id));
    }
  });
  flowsG.innerHTML = '';
  flows = [];
  (m.flows || []).forEach(f => {
    const path = document.getElementById(f.p), len = path.getTotalLength();
    const dirs = f.both ? [false, true] : [!!f.r];
    dirs.forEach(rev => {
      for (let i = 0; i < f.n; i++) {
        const el = document.createElementNS('http://www.w3.org/2000/svg', f.shape === 'dot' ? 'circle' : f.shape === 'env' ? 'g' : 'rect');
        if (f.shape === 'dot') { el.setAttribute('r', 4.5); el.setAttribute('fill', f.c); }
        else if (f.shape === 'env') { el.innerHTML = '<rect x="-10" y="-7" width="20" height="14" rx="2.5" fill="#FEFEFB" stroke="' + f.c + '" stroke-width="2"/><path d="M-8 -5 L0 1.5 L8 -5" fill="none" stroke="' + f.c + '" stroke-width="1.8" stroke-linecap="round"/>'; }
        else if (f.shape === 'dia') { el.setAttribute('width', 10); el.setAttribute('height', 10); el.setAttribute('x', -5); el.setAttribute('y', -5); el.setAttribute('fill', f.c); el.setAttribute('transform-origin', '0 0'); el.dataset.rot = '45'; }
        else { el.setAttribute('width', 16); el.setAttribute('height', 11); el.setAttribute('x', -8); el.setAttribute('y', -5.5); el.setAttribute('rx', 2.5); el.setAttribute('fill', f.c); el.setAttribute('stroke', '#333D2E'); el.setAttribute('stroke-width', 1.2); }
        flowsG.appendChild(el);
        flows.push({ el, path, len, s: f.s, off: (i / f.n + (f.delay || 0) + (rev ? .5 / f.n : 0)) % 1, rev, rot: el.dataset.rot || 0 });
      }
    });
  });
  drawFlows(0);
}
let phase = 0;
function drawFlows(dt){
  if (!reduce) phase += dt;
  flows.forEach(f => {
    let u = reduce ? f.off : (phase * f.s + f.off) % 1;
    if (f.rev) u = 1 - u;
    const pt = f.path.getPointAtLength(u * f.len);
    f.el.setAttribute('transform', 'translate(' + pt.x.toFixed(1) + ',' + pt.y.toFixed(1) + ')' + (f.rot ? ' rotate(' + f.rot + ')' : ''));
    const edge = Math.min(u, 1 - u);
    f.el.style.opacity = Math.min(1, edge * 8).toFixed(2);
  });
}

/* ── 播放控制 ── */
const audio = $('#audio'), subs = $('#subs'), card = $('#card');
const offsets = []; let total = 0;
TIMELINE.forEach(ch => { offsets.push(total); total += ch.dur; });
let ci = 0, curScene = null, playing = false, cc = true, cardTok = 0;
const fmt = t => Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');
$('#totalLen').textContent = '约 ' + Math.round(total / 60) + ' 分钟';

function cueAt(ch, t){
  const cs = ch.cues;
  for (let i = cs.length - 1; i >= 0; i--) if (t >= cs[i].t0 - 0.05) return cs[i];
  return cs[0];
}
function setScene(cue){
  if (!cue) return;
  subs.textContent = cue.sub;
  if (curScene === cue.scene) return;
  curScene = cue.scene;
  const sc = S[cue.scene];
  applyMap(sc.map);
  const tok = ++cardTok;
  if (reduce) { card.innerHTML = sc.card(); return; }
  card.classList.add('fade');
  setTimeout(() => { if (tok !== cardTok) return; card.innerHTML = sc.card(); card.classList.remove('fade'); }, 180);
}
function renderChapters(){
  const box = $('#chs'); box.innerHTML = '';
  TIMELINE.forEach((ch, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chb';
    b.setAttribute('aria-current', String(i === ci));
    b.innerHTML = '<span class="n">第 ' + (i + 1) + ' 章 · ' + fmt(ch.dur) + '</span><span class="t"></span>';
    b.querySelector('.t').textContent = ch.title;
    b.addEventListener('click', () => loadChapter(i, 0, true));
    box.appendChild(b);
  });
  const ch = TIMELINE[ci];
  $('#more').innerHTML = '<span>深入看：</span>' + ch.more.map(m => '<a href="' + m[1] + '" target="_top">' + m[0] + ' →</a>').join('');
  const prog = $('#prog');
  prog.querySelectorAll('.tick').forEach(t => t.remove());
  offsets.slice(1).forEach(o => { const t = document.createElement('span'); t.className = 'tick'; t.style.left = (o / total * 100) + '%'; prog.appendChild(t); });
}
function loadChapter(i, t, autoplay){
  ci = Math.max(0, Math.min(TIMELINE.length - 1, i));
  const ch = TIMELINE[ci];
  if (!audio.src.endsWith(ch.src)) audio.src = ch.src;
  const go = () => { audio.currentTime = t || 0; if (autoplay) play(); };
  if (audio.readyState >= 1) go(); else audio.addEventListener('loadedmetadata', go, { once: true });
  curScene = null;
  setScene(cueAt(ch, t || 0));
  renderChapters();
  tick();
}
function play(){
  $('#playBig').classList.add('off');
  audio.play().then(() => { playing = true; syncBtn(); }).catch(() => { playing = false; syncBtn(); });
}
function pause(){ audio.pause(); playing = false; syncBtn(); }
function syncBtn(){ const b = $('#btnPlay'); b.textContent = playing ? '❚❚' : '▶'; b.setAttribute('aria-label', playing ? '暂停' : '播放'); }
function tick(){
  const g = offsets[ci] + (audio.currentTime || 0);
  $('#time').textContent = fmt(g) + ' / ' + fmt(total);
  $('#progFill').style.width = (g / total * 100).toFixed(2) + '%';
  $('#prog').setAttribute('aria-valuenow', Math.round(g / total * 100));
}
audio.addEventListener('timeupdate', () => { setScene(cueAt(TIMELINE[ci], audio.currentTime)); tick(); });
audio.addEventListener('ended', () => { if (ci < TIMELINE.length - 1) loadChapter(ci + 1, 0, true); else { playing = false; syncBtn(); } });
audio.addEventListener('pause', () => { if (!audio.ended) { playing = false; syncBtn(); } });
audio.addEventListener('play', () => { playing = true; syncBtn(); });

$('#playBigBtn').addEventListener('click', () => { loadChapter(ci, audio.currentTime || 0, true); });
$('#btnPlay').addEventListener('click', () => { if (playing) pause(); else { if (!audio.src) loadChapter(ci, 0, true); else play(); } });
$('#btnPrev').addEventListener('click', () => loadChapter(audio.currentTime > 3 ? ci : ci - 1, 0, playing));
$('#btnNext').addEventListener('click', () => loadChapter(ci + 1, 0, playing));
$('#btnCC').addEventListener('click', e => { cc = !cc; subs.classList.toggle('hidden-cc', !cc); e.currentTarget.setAttribute('aria-pressed', String(cc)); });
const RATES = [1, 1.25, 1.5];
$('#btnRate').addEventListener('click', e => { const r = RATES[(RATES.indexOf(audio.playbackRate) + 1) % RATES.length]; audio.playbackRate = r; e.currentTarget.textContent = r + '×'; });
function seekGlobal(frac){
  const g = Math.max(0, Math.min(total - 0.1, frac * total));
  let i = offsets.length - 1; while (i > 0 && offsets[i] > g) i--;
  loadChapter(i, g - offsets[i], playing);
}
$('#prog').addEventListener('click', e => { const r = e.currentTarget.getBoundingClientRect(); seekGlobal((e.clientX - r.left) / r.width); });
$('#prog').addEventListener('keydown', e => {
  const g = offsets[ci] + audio.currentTime;
  if (e.key === 'ArrowRight') { e.preventDefault(); seekGlobal((g + 5) / total); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); seekGlobal((g - 5) / total); }
});
document.addEventListener('keydown', e => {
  if (e.target.closest('button,input,a,[role=slider]')) return;
  if (e.code === 'Space') { e.preventDefault(); $('#btnPlay').click(); }
});

/* ── 动画循环：只在播放时推进 ── */
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (playing) drawFlows(dt * (audio.playbackRate || 1));
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ── 文字稿 ── */
$('#trBody').innerHTML = TIMELINE.map((ch, i) => '<h4>第 ' + (i + 1) + ' 章 · ' + ch.title + '</h4>' + ch.cues.map(c => '<p></p>').join('')).join('');
let pi = 0; const ps = $('#trBody').querySelectorAll('p');
TIMELINE.forEach(ch => ch.cues.forEach(c => { ps[pi++].textContent = c.sub; }));

/* ── 嵌入首页时，把高度告诉父页面 ── */
if (embedded && window.parent !== window) {
  const post = () => window.parent.postMessage({ type: 'overview-height', h: Math.ceil(document.body.getBoundingClientRect().height) + 2 }, '*');
  new ResizeObserver(post).observe(document.body); post();
  window.addEventListener('load', post);
  window.addEventListener('resize', post);
  if (document.fonts) document.fonts.ready.then(post);
}

if (TIMELINE.length) { renderChapters(); setScene(TIMELINE[0].cues[0]); tick(); }
})();
</script>
</body>
</html>
